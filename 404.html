<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
  const path = window.location.pathname;
  const cleanPath = path.replace(/^\/+/g, '');
  if (cleanPath) {
    window.location.href = '/' + cleanPath + '.html';
  } else {
    window.location.href = '/index.html';
  }
</script>

    <meta http-equiv="refresh" content="0; URL=/" />
  </head>
</html>
