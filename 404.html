<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      const path = window.location.pathname;

      // Manual redirects based on path
      if (path === "/signin") {
        window.location.replace("/signin/");
      } else if (path === "/signup") {
        window.location.replace("/signup/");
      } else {
        // Show 404 if nothing matches
        document.write("<h1>404 Not Found</h1><p>This page does not exist.</p>");
      }
    </script>
  </head>
  <body></body>
</html>
