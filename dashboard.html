<!-- dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <style>
    body { background: #111; color: white; font-family: Arial, sans-serif; text-align: center; padding-top: 50px; }
    button { padding: 10px 20px; border: none; background: #00c3ff; color: white; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Welcome to your Dashboard</h1>
  <p id="user-email">Loading user...</p>
  <button onclick="logout()">Logout</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAw24T9OSc17wEa_Tjm05rNECyL3BboHSc",
      authDomain: "es-id-c3ec1.firebaseapp.com",
      projectId: "es-id-c3ec1",
      storageBucket: "es-id-c3ec1.appspot.com",
      messagingSenderId: "1062622315075",
      appId: "1:1062622315075:web:b1b61c98cfa9925c888af6",
      measurementId: "G-P2LF0R55KE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("user-email").textContent = `Logged in as: ${user.email}`;
      } else {
        window.location.href = "/signin";
      }
    });

    window.logout = () => {
      signOut(auth).then(() => window.location.href = "/signin");
    };
  </script>
</body>
</html>
