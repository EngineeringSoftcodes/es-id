<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ES ID Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0e0e10;
      color: #ffffff;
      margin: 0;
      padding: 0;
    }

    header {
      background: #1f1f23;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .avatar-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .avatar-container img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #3a3a3d;
    }

    .change-avatar-btn {
      background: #2e2e33;
      color: #fff;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    main {
      padding: 30px;
    }

    h2 {
      margin-bottom: 10px;
    }

    input, select {
      width: 300px;
      padding: 10px;
      margin-bottom: 15px;
      border: none;
      border-radius: 6px;
      background: #2e2e33;
      color: #fff;
    }

    .account-buttons button {
      background: #2e2e33;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      margin-right: 10px;
      cursor: pointer;
    }

    .danger-zone button {
      background: #9e2b2b;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <header>
    <h1>ES ID Dashboard</h1>
    <div class="avatar-container">
      <img id="avatar" src="/assets/avatar-default.png" alt="Profile Avatar" />
      <input type="file" id="avatarUpload" accept="image/*" style="display: none;" />
      <button class="change-avatar-btn" onclick="document.getElementById('avatarUpload').click()">Change Avatar</button>
    </div>
  </header>

  <main>
    <h2>Profile</h2>
    <label>Display Name</label><br>
    <input type="text" placeholder="PolandLetsPlay" /><br>

    <label>Country</label><br>
    <select>
      <option>Germany</option>
      <option>Poland</option>
      <option>United States</option>
      <!-- Add more countries -->
    </select><br>

    <h2>Connected Accounts</h2>
    <div class="account-buttons">
      <button>Connect Steam</button>
      <button>Connect Twitch</button>
      <button>Connect Xbox</button>
    </div>

    <h2>Danger Zone</h2>
    <div class="danger-zone">
      <button onclick="confirm('Are you sure you want to log out?')">Logout</button><br>
      <button onclick="confirm('Are you sure you want to delete your account? This cannot be undone.')">Delete Account</button>
    </div>
  </main>

  <script>
    // Avatar load from localStorage
    const avatar = document.getElementById('avatar');
    const fileInput = document.getElementById('avatarUpload');

    const savedAvatar = localStorage.getItem('userAvatar');
    if (savedAvatar) avatar.src = savedAvatar;

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        avatar.src = e.target.result;
        localStorage.setItem('userAvatar', e.target.result);
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
