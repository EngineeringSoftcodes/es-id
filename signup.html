<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ES ID - Sign Up</title>
  <style>
    body { background: #111; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    input, button { padding: 10px; margin: 10px; border-radius: 5px; border: none; }
    input { width: 200px; }
    button { background: #00c3ff; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Create ES ID</h2>
  <input type="email" id="signup-email" placeholder="Email"><br>
  <input type="password" id="signup-password" placeholder="Password"><br>
  <button onclick="signUp()">Sign Up</button>
  <br><a href="login.html" style="color:#00c3ff">Already have an account? Login</a>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_MSG_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.signUp = () => {
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      createUserWithEmailAndPassword(auth, email, password)
        .then(() => window.location.href = 'dashboard.html')
        .catch(error => alert(error.message));
    }
  </script>
</body>
</html>
