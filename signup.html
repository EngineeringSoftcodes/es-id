<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ES ID - Sign Up</title>
  <style>
    :root {
      --orange: #f7941d;
      --dark-blue: #0a0a0f;
      --gray: #ccc;
      --white: #fff;
      --black: #000;
    }
    body {
      background: linear-gradient(145deg, #ffffff, #e5e5e5);
      color: var(--black);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .form-container {
      background: var(--white);
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }
    input, button {
      padding: 10px;
      margin: 10px 0;
      width: 100%;
      border: 1px solid var(--gray);
      border-radius: 5px;
    }
    button {
      background: var(--dark-blue);
      color: var(--white);
      cursor: pointer;
    }
    button:hover {
      background: var(--orange);
    }
    .link {
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Create ES ID</h2>
    <input type="text" id="signup-username" placeholder="Username" required>
    <input type="email" id="signup-email" placeholder="Email" required>
    <input type="password" id="signup-password" placeholder="Password" required>
    <label><input type="checkbox" id="anti-bot-check"> I'm not a bot</label>
    <button onclick="signUp()">Sign Up</button>
    <div class="link">
      <p>Already have an account? <a href="/signin">Sign In</a></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAw24T9OSc17wEa_Tjm05rNECyL3BboHSc",
      authDomain: "es-id-c3ec1.firebaseapp.com",
      projectId: "es-id-c3ec1",
      storageBucket: "es-id-c3ec1.appspot.com",
      messagingSenderId: "1062622315075",
      appId: "1:1062622315075:web:b1b61c98cfa9925c888af6",
      measurementId: "G-P2LF0R55KE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.signUp = async () => {
      const username = document.getElementById("signup-username").value.trim();
      const email = document.getElementById("signup-email").value;
      const password = document.getElementById("signup-password").value;
      const antiBot = document.getElementById("anti-bot-check").checked;

      if (!antiBot) return alert("Please confirm you're not a bot.");
      if (!username) return alert("Username is required.");

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        await setDoc(doc(db, "users", user.uid), {
          username,
          email,
          uid: user.uid
        });
        window.location.href = "/dashboard";
      } catch (error) {
        alert("Error: " + error.message);
      }
    };
  </script>
</body>
</html>
